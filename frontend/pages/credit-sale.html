<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Sales | Karibu Groceries</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/design-system.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/main.css" />
  </head>

  <body>
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="page-wrapper">
      <header class="dashboard-header dashboard-header--sticky">
        <div class="content-container">
          <h4 class="mb-1 fw-bold">Credit / Deferred Sales</h4>
          <p class="page-subtitle mb-0">
            Record trusted buyer credit transactions
          </p>
        </div>
      </header>

      <main class="content-container py-4 py-lg-5">
        <div class="row justify-content-center">
          <div class="col-lg-10 col-xl-8">
            <div class="summary-card">
              <h4 class="text-center fw-bold mb-4">Record Credit Sale</h4>

              <form id="creditSaleForm" novalidate autocomplete="off">
                <!-- BUYER INFORMATION -->
                <h5 class="section-title mb-3">Buyer Information</h5>
                <p class="text-muted small mb-4">
                  Required for accountability and payment follow-up.
                </p>

                <div class="row g-3 mb-5">
                  <div class="col-md-6">
                    <div class="form-floating">
                      <input
                        class="form-control"
                        id="buyerName"
                        required
                        placeholder="Full name"
                      />
                      <label>Buyer Name</label>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="form-floating">
                      <input
                        class="form-control"
                        id="contact"
                        required
                        placeholder="07XXXXXXXX"
                        maxlength="10"
                      />
                      <label>Contact Number</label>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="form-floating">
                      <input
                        class="form-control text-uppercase"
                        id="nin"
                        required
                        placeholder="e.g. CM123456789012"
                        maxlength="16"
                      />
                      <label>National ID (NIN)</label>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="form-floating">
                      <input
                        class="form-control"
                        id="location"
                        required
                        placeholder="Village / Town / Parish"
                      />
                      <label>Location</label>
                    </div>
                  </div>
                </div>

                <!-- PRODUCE & STOCK -->
                <h5 class="section-title mb-3">Produce & Stock</h5>

                <div class="row g-3 mb-5">
                  <div class="col-md-6">
                    <div class="form-floating">
                      <select class="form-select" id="produceSelect" required>
                        <option value="" disabled selected>
                          Loading stock...
                        </option>
                      </select>
                      <label>Produce</label>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="form-floating">
                      <input class="form-control" id="produceType" readonly />
                      <label>Produce Type</label>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="form-floating">
                      <input class="form-control" id="branch" readonly />
                      <label>Branch</label>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="form-floating">
                      <input
                        class="form-control"
                        id="availableStock"
                        readonly
                      />
                      <label>Available Stock (KG)</label>
                    </div>
                  </div>
                </div>

                <!-- DISPATCH & PAYMENT -->
                <h5 class="section-title mb-3">Dispatch & Payment Terms</h5>

                <div class="row g-3 mb-5">
                  <div class="col-md-6">
                    <div class="form-floating">
                      <input
                        type="number"
                        class="form-control"
                        id="tonnage"
                        step="any"
                        min="0.1"
                        required
                        placeholder="e.g. 45.5"
                      />
                      <label>Quantity Dispatched (KG)</label>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="form-floating">
                      <input
                        type="date"
                        class="form-control"
                        id="dueDate"
                        required
                        min=""
                      />
                      <label>Payment Due Date</label>
                    </div>
                  </div>

                  <div class="col-md-8">
                    <div class="form-floating">
                      <input
                        class="form-control fw-semibold text-danger"
                        id="amountDue"
                        readonly
                      />
                      <label>Total Amount Due (UGX)</label>
                    </div>
                  </div>

                  <div class="col-md-4">
                    <div class="form-floating">
                      <input class="form-control" id="salesAgent" readonly />
                      <label>Sales Agent</label>
                    </div>
                  </div>
                </div>

                <!-- SUBMIT -->
                <div class="d-grid">
                  <button type="submit" class="btn-action btn-lg">
                    <i class="fas fa-save me-2"></i> Record Credit Sale
                  </button>
                </div>

                <p class="text-center text-muted small mt-3">
                  <i class="fas fa-info-circle me-1"></i>
                  Transaction will appear in outstanding credit records.
                </p>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/sales/creditSale.js"></script>

    <script>
      (async function loadLayout() {
        try {
          const [navbarHTML, sidebarHTML] = await Promise.all([
            fetch("../navbar.html").then((r) => r.text()),
            fetch("../sidebar.html").then((r) => r.text()),
          ]);

          document.getElementById("navbar-container").innerHTML = navbarHTML;
          document.getElementById("sidebar-container").innerHTML = sidebarHTML;

          ["navbar", "sidebar"].forEach((name) => {
            const script = document.createElement("script");
            script.src = `../js/${name}.js`;
            script.defer = true;
            document.body.appendChild(script);
          });

          const session = JSON.parse(
            localStorage.getItem("kglSession") || "null",
          );
          if (session?.user?.role) {
            document.querySelectorAll("[data-role]").forEach((el) => {
              el.hidden = !el.dataset.role
                .split(" ")
                .includes(session.user.role);
            });
          }
        } catch (err) {
          console.error("Layout loading failed:", err);
        }
      })();
    </script>
  </body>
</html>
