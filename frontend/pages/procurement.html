<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produce Procurement | Karibu Groceries</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/design-system.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/main.css" />
  </head>

  <body data-role="manager">
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="page-wrapper">
      <header class="dashboard-header dashboard-header--sticky">
        <div class="content-container">
          <h4 class="mb-1 fw-bold">Produce Procurement</h4>
          <p class="page-subtitle mb-0">
            Record newly received produce into branch inventory
          </p>
        </div>
      </header>

      <main class="content-container py-4 py-lg-5">
        <div class="row justify-content-center">
          <div class="col-lg-10 col-xl-8">
            <div class="card">
              <div class="card-body">
                <h4 class="fw-bold text-center mb-4">New Produce Delivery</h4>

                <form id="procurementForm" novalidate>
                  <!-- PRODUCE DETAILS -->
                  <h4 class="section-title">Produce Details</h4>
                  <div class="row g-3 mb-4">
                    <div class="col-md-6">
                      <div class="form-floating">
                        <input
                          type="text"
                          class="form-control"
                          id="produceName"
                          name="produceName"
                          minlength="2"
                          required
                          placeholder="e.g. Matooke"
                        />
                        <label for="produceName">Produce Name</label>
                      </div>
                    </div>

                    <div class="col-md-6">
                      <div class="form-floating">
                        <input
                          type="text"
                          class="form-control"
                          id="produceType"
                          name="produceType"
                          minlength="2"
                          required
                          placeholder="e.g. Cavendish"
                        />
                        <label for="produceType">Produce Variety / Type</label>
                      </div>
                    </div>

                    <div class="col-12">
                      <div class="form-floating">
                        <select
                          class="form-select"
                          id="sourceType"
                          name="sourceType"
                          required
                        >
                          <option value="" disabled selected>
                            Select source
                          </option>
                          <option value="individual">Individual Dealer</option>
                          <option value="company">Company Supplier</option>
                          <option value="farm">Karibu Groceries Farm</option>
                        </select>
                        <label for="sourceType">Source of Produce</label>
                      </div>
                    </div>
                  </div>

                  <!-- DELIVERY -->
                  <h4 class="section-title">Delivery Information</h4>
                  <div class="row g-3 mb-4">
                    <div class="col-md-4">
                      <label class="form-label small">Delivery Date</label>
                      <input
                        type="date"
                        class="form-control"
                        id="date"
                        name="deliveryDate"
                        required
                      />
                    </div>

                    <div class="col-md-4">
                      <label class="form-label small">Delivery Time</label>
                      <input
                        type="time"
                        class="form-control"
                        id="time"
                        name="deliveryTime"
                        required
                      />
                    </div>

                    <div class="col-md-4">
                      <label class="form-label small">Quantity (KG)</label>
                      <input
                        type="number"
                        class="form-control"
                        id="tonnage"
                        name="tonnage"
                        min="1000"
                        step="0.1"
                        required
                        placeholder="e.g. 2500"
                      />
                    </div>
                  </div>

                  <!-- SUPPLIER -->
                  <h4 class="section-title">Supplier Details</h4>
                  <div class="row g-3 mb-4">
                    <div class="col-md-6">
                      <div class="form-floating">
                        <input
                          type="text"
                          class="form-control"
                          id="dealerName"
                          name="dealerName"
                          required
                          placeholder="e.g. John Doe Farms"
                        />
                        <label for="dealerName">Supplier Name</label>
                      </div>
                    </div>

                    <div class="col-md-6">
                      <div class="form-floating">
                        <input
                          type="tel"
                          class="form-control"
                          id="dealerContact"
                          name="dealerContact"
                          pattern="^07\d{8}$"
                          required
                          placeholder="07XXXXXXXX"
                        />
                        <label for="dealerContact">Supplier Contact</label>
                      </div>
                    </div>
                  </div>

                  <!-- STOCK & PRICING -->
                  <h4 class="section-title">Stock Allocation & Pricing</h4>
                  <div class="row g-3 mb-4">
                    <div class="col-md-4">
                      <div class="form-floating">
                        <input
                          type="text"
                          class="form-control"
                          id="branch"
                          name="branch"
                          readonly
                        />
                        <label for="branch">Receiving Branch</label>
                      </div>
                    </div>

                    <div class="col-md-4">
                      <div class="form-floating">
                        <input
                          type="number"
                          class="form-control"
                          id="cost"
                          name="cost"
                          min="10000"
                          step="100"
                          required
                          placeholder="e.g. 4500000"
                        />
                        <label for="cost">Total Cost (UGX)</label>
                      </div>
                    </div>

                    <div class="col-md-4">
                      <div class="form-floating">
                        <input
                          type="number"
                          class="form-control"
                          id="sellingPrice"
                          name="sellingPrice"
                          min="100"
                          step="10"
                          required
                          placeholder="e.g. 1800"
                        />
                        <label for="sellingPrice"
                          >Selling Price / KG (UGX)</label
                        >
                      </div>
                    </div>
                  </div>

                  <div class="d-grid mt-4">
                    <button type="submit" class="btn-action">
                      <i class="fa-solid fa-floppy-disk me-2"></i> Save
                      Procurement Record
                    </button>
                  </div>

                  <p class="page-subtitle text-center mt-3 text-muted small">
                    Inventory updates automatically after saving.
                  </p>
                </form>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <!-- defines apiRequest -->
    <script src="../js/auth.js"></script>
    <script src="../js/manager/procurement.js"></script>

    <!-- Layout Loader -->
    <script>
      (async function loadLayout() {
        try {
          const [navbarHTML, sidebarHTML] = await Promise.all([
            fetch("../navbar.html").then((r) => r.text()),
            fetch("../sidebar.html").then((r) => r.text()),
          ]);

          document.getElementById("navbar-container").innerHTML = navbarHTML;
          document.getElementById("sidebar-container").innerHTML = sidebarHTML;

          ["navbar", "sidebar"].forEach((name) => {
            const script = document.createElement("script");
            script.src = `../js/${name}.js`;
            script.defer = true;
            document.body.appendChild(script);
          });
        } catch (err) {
          console.error("Layout load failed:", err);
        }
      })();

      /* Auto-fill date & time */
      const now = new Date();
      document.getElementById("date").value = now.toISOString().split("T")[0];
      document.getElementById("time").value = now.toTimeString().slice(0, 5);
    </script>
  </body>
</html>
